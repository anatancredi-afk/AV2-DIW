
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado</title>
    <link rel="stylesheet" href="lib/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-dark navbar-fazenda">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="img/logo-fazenda.jpg" width="48">
                Votação 2026
            </a>
            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="index.html">Início</a>
                    <a class="nav-link" href="votacao.html">Votar</a>
                    <a class="nav-link active" href="resultado.html">Resultado</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="container my-4">
        <h1>Parcial da eliminação</h1>
        <p><strong id="total-votos">0</strong> votos computados</p>

        <div id="placar"></div>

        <button id="btn-zerar" class="btn btn-outline-light mt-3"
            data-bs-toggle="modal" data-bs-target="#modalZerar">
            Zerar votação
        </button>
    </main>
    <!-- botao pra tentar zerar -->
    <div class="modal fade" id="modalZerar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Zerar votação?</h5>
                    <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    Todos os votos serão apagados.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Cancelar
                    </button>
                    <button type="button" id="confirmar-zerar"
                        class="btn btn-danger">
                        Confirmar
                    </button>
                </div>
            </div>
        </div>
    </div>
    <footer class="text-center py-4">
        DIW 2026, PUC Minas
    </footer>
    <script src="lib/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/resultado.js"></script>
</body>
</html>
